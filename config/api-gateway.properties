# Application name
spring.application.name=api-gateway

# Port
server.port=8080

# config
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-registration
spring.cloud.gateway.routes[0].uri=lb://user-registration
spring.cloud.gateway.routes[0].predicates[0]=Path=/register/**
spring.cloud.gateway.routes[1].id=authentication-service
spring.cloud.gateway.routes[1].uri=lb://authentication-service
spring.cloud.gateway.routes[1].predicates[1]=Path=/auth/**
spring.cloud.gateway.routes[2].id=account-balance-service
spring.cloud.gateway.routes[2].uri=lb://account-balance-service
spring.cloud.gateway.routes[2].predicates[2]=Path=/balance/**

## Eureka server details
eureka.client.server-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.register-with-eureka=true
eureka.client.service-url.fetch-registry=true

## Logging
logging.level.org.springframework=INFO
logging.level.com.capstone.banking.register=DEBUG

## Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always
