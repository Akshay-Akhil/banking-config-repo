# Application name
spring.application.name=api-gateway

# Port
server.port=8080

# =============================
# Gateway routing
# =============================
spring.cloud.gateway.enabled=false
spring.cloud.gateway.routes[0].id=user-registration
spring.cloud.gateway.routes[0].uri=lb://user-registration
spring.cloud.gateway.routes[0].predicates[0]=Path=/register/**

spring.cloud.gateway.routes[1].id=authentication-service
spring.cloud.gateway.routes[1].uri=lb://authentication-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[2].id=account-balance-service
spring.cloud.gateway.routes[2].uri=lb://account-balance-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/balance/**

# =============================
# Eureka
# =============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =============================
# Actuator
# =============================
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

# =============================
# Logging (debug temporarily)
# =============================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG